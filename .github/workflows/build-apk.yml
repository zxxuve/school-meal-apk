
name: Build School Meal APK

on:
  workflow_dispatch:
  push:
    paths:
      - "SchoolMealAndroid.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          unzip -o SchoolMealAndroid.zip -d .
          gradle -p SchoolMealAndroid assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: school-meal-debug-apk
          path: SchoolMealAndroid/app/build/outputs/apk/debug/app-debug.apk
